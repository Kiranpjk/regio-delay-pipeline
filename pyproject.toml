[project]
name = "regio-delays"
version = "0.1.0"
description = "Batch pipeline that collects regional train departures from the public DB transport REST API into DuckDB and reports punctuality per line."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
regio-delays = "regio_delays.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
